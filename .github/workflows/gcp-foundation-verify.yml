name: GCP foundation verify

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Verify short-lived identity and foundation inventory
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          set -euo pipefail
          test "$(gcloud config get-value account)" = "github-deployer@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          read -r database_version database_region database_tier < <(
            gcloud sql instances describe ff-restaurent-db \
              --project "$GCP_PROJECT_ID" \
              --format='value(databaseVersion,region,settings.tier)'
          )
          test "$database_version" = POSTGRES_16
          test "$database_region" = asia-east1
          test "$database_tier" = db-custom-1-3840
          gcloud artifacts repositories describe ff-restaurent \
            --project "$GCP_PROJECT_ID" \
            --location "$GCP_REGION" \
            --format='value(format)' \
            | grep -Fx DOCKER
          for service in ff-restaurent-api ff-restaurent-web; do
            gcloud run services describe "$service" \
              --project "$GCP_PROJECT_ID" \
              --region "$GCP_REGION" \
              --format='value(metadata.name)' \
              | grep -Fx "$service"
          done
      - name: Verify IAM policy matches provisioning script
        shell: bash
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          script=scripts/provision-gcp-foundation.sh
          runtime_service_account="ff-runtime@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          deploy_service_account="github-deployer@${GCP_PROJECT_ID}.iam.gserviceaccount.com"
          rc=0

          # Diffs the script's declared IAM grants against what's actually live, in
          # both directions. "Missing" catches accidental de-provisioning; "extra"
          # catches exactly what happened before FF-56's provisioning script fell
          # out of sync with a manual grant during the v2.2.0 release (PRs #99/#100,
          # #106) -- an undeclared permission that only worked because someone
          # granted it by hand and never folded it back into this script.
          #
          # Scope: project-level roles ($runtime_member/$deploy_member) and the
          # deploy account's roles on the runtime service account. Deliberately
          # excludes the workloadIdentityUser grants on three dynamically built
          # WIF principals -- if federation drifted, the auth step earlier in
          # this same job would already have failed before reaching here.
          compare_roles() {
            local label="$1" expected="$2" live="$3" missing extra
            missing="$(comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$live"))"
            extra="$(comm -13 <(printf '%s\n' "$expected") <(printf '%s\n' "$live"))"
            if [[ -z "$missing" && -z "$extra" ]]; then
              echo "IAM in sync: ${label}"
              return 0
            fi
            if [[ -n "$missing" ]]; then
              echo "::error::${label}: declared in ${script} but missing from the live IAM policy:"
              echo "$missing"
            fi
            if [[ -n "$extra" ]]; then
              echo "::error::${label}: granted live but not declared in ${script} -- fold this back into the script:"
              echo "$extra"
            fi
            return 1
          }

          runtime_project_expected="$(grep 'ensure_project_role.*"\$runtime_member"' "$script" | grep -oE 'roles/[^[:space:]]+' | sort -u)"
          runtime_project_live="$(gcloud projects get-iam-policy "$GCP_PROJECT_ID" \
            --flatten='bindings[].members' \
            --filter="bindings.members:serviceAccount:${runtime_service_account}" \
            --format='value(bindings.role)' | sort -u)"
          compare_roles "project roles for ${runtime_service_account}" "$runtime_project_expected" "$runtime_project_live" || rc=1

          deploy_project_expected="$(grep 'ensure_project_role.*"\$deploy_member"' "$script" | grep -oE 'roles/[^[:space:]]+' | sort -u)"
          deploy_project_live="$(gcloud projects get-iam-policy "$GCP_PROJECT_ID" \
            --flatten='bindings[].members' \
            --filter="bindings.members:serviceAccount:${deploy_service_account}" \
            --format='value(bindings.role)' | sort -u)"
          compare_roles "project roles for ${deploy_service_account}" "$deploy_project_expected" "$deploy_project_live" || rc=1

          runtime_sa_expected="$(grep 'ensure_service_account_role.*"\$RUNTIME_SERVICE_ACCOUNT".*"\$deploy_member"' "$script" | grep -oE 'roles/[^[:space:]]+' | sort -u)"
          runtime_sa_live="$(gcloud iam service-accounts get-iam-policy "$runtime_service_account" \
            --project "$GCP_PROJECT_ID" \
            --flatten='bindings[].members' \
            --filter="bindings.members:serviceAccount:${deploy_service_account}" \
            --format='value(bindings.role)' | sort -u)"
          compare_roles "${deploy_service_account} roles on ${runtime_service_account}" "$runtime_sa_expected" "$runtime_sa_live" || rc=1

          exit "$rc"
